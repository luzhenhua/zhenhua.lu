# zhenhua.lu — static export behind Cloudflare proxy.
#
# DNS / EdgeOne / Cloudflare dashboard are out of scope for this file.
# Operator steps that are NOT done here:
#   - Point apex (@) and www at this origin with the Cloudflare proxy enabled.
#   - Leave TLS certificates and API tokens on the machine that already has them.
#
# Origin listens on port 80 only, so no certificate is required on the VM.
# Cloudflare SSL/TLS mode must be Flexible while the origin is HTTP.
# Do not add an origin HTTP→HTTPS redirect: with the proxy on, $scheme is
# always http and that redirect loops. www→apex is a host redirect, not a
# scheme redirect, and is safe.
#
# Install:
#   sudo mkdir -p /var/www/zhenhua.lu
#   sudo mkdir -p /tmp/zhenhua-lu-extract
#   sudo tar -xzf zhenhua-lu-static.tar.gz -C /tmp/zhenhua-lu-extract
#   sudo rsync -a --delete /tmp/zhenhua-lu-extract/www/ /var/www/zhenhua.lu/
#   sudo cp /tmp/zhenhua-lu-extract/nginx/zhenhua.lu.conf /etc/nginx/sites-available/zhenhua.lu.conf
#   sudo ln -sfn /etc/nginx/sites-available/zhenhua.lu.conf /etc/nginx/sites-enabled/zhenhua.lu.conf
#   sudo nginx -t && sudo systemctl reload nginx

# www → apex. 301, preserving path and query.
server {
    listen 80;
    listen [::]:80;
    server_name www.zhenhua.lu;

    return 301 https://zhenhua.lu$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name zhenhua.lu;

    root /var/www/zhenhua.lu;
    index index.html;

    # Canonical URLs have no trailing slash. Send /projects/ to /projects
    # before try_files would miss projects.html.
    rewrite ^/(.+)/$ https://zhenhua.lu/$1 permanent;

    # Next.js `output: 'export'` (trailingSlash default false) writes
    #   /           → index.html and index.txt
    #   /projects   → projects.html and projects.txt
    # Client navigations fetch the `.txt` flight payload. Those files must be
    # served as text/plain (nginx mime.types already maps txt → text/plain).
    # Same-named directories (RSC segment files) must not win over the HTML file.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # /home was a permanent redirect in next.config.ts. Static export does not
    # apply redirects(), so nginx owns it.
    location = /home {
        return 301 https://zhenhua.lu/$is_args$args;
    }

    # Prerendered next/og image. The file has no extension, so set the type.
    # `?title=` is not applied; the body is the build-time default.
    location = /api/og {
        default_type image/png;
        try_files /api/og =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Security headers from next.config.ts headers().
    add_header X-DNS-Prefetch-Control "on" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Robots-Tag "index, follow" always;
    add_header X-Content-Type-Options "nosniff" always;

    # A location that sets any add_header drops server-level add_header.
    # Repeat the security headers in each location that also sets Cache-Control.
    # ^~ so these prefixes win over the extension regex below.

    location ^~ /_next/static/ {
        add_header X-DNS-Prefetch-Control "on" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Robots-Tag "index, follow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ^~ /images/ {
        add_header X-DNS-Prefetch-Control "on" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Robots-Tag "index, follow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /portfolio.png {
        add_header X-DNS-Prefetch-Control "on" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Robots-Tag "index, follow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~* \.(?:mp4|webm|svg|jpg|jpeg|png|gif|webp|avif|ico)$ {
        add_header X-DNS-Prefetch-Control "on" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Robots-Tag "index, follow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml
        application/xml
        text/xml;
}
